on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        node:
          - 18
          - 20
          - 22

    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: pnpm ci
      - run: pnpm run lint
      - run: pnpm run build
